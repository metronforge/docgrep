[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docgrep"
version = "0.1.0"
description = "Local document corpus search service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "blake3>=1,<2",
    "chardet>=5,<6",
    "markdown-it-py>=3,<5",
    "pydantic-settings>=2,<3",
    "pymupdf>=1.24,<2",
    "pyyaml>=6,<7",
    "qdrant-client>=1.12,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<9",
    "ruff>=0.11,<1",
    "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docgrep"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["gpu: requires real models or GPU hardware"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/docgrep/__init__.py:__version__"]
