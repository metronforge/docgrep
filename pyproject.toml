[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "docgrep"
version = "1.10.0"
description = "Local document corpus search service"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "blake3>=1,<2",
    "chardet>=5,<6",
    "fastapi>=0.115,<1",
    "markdown-it-py>=3,<5",
    "pydantic-settings>=2,<3",
    "pymupdf>=1.24,<2",
    "pyyaml>=6,<7",
    "qdrant-client>=1.12,<2",
    "sentence-transformers>=3,<6",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
cpu = ["torch>=2.14,<3"]
cu130 = ["torch>=2.14,<3"]

[project.scripts]
docgrep = "docgrep.api.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.15,<2",
    "pytest>=8,<9",
    "ruff>=0.11,<1",
    "types-pyyaml>=6,<7",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/docgrep"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-m", "not gpu"]
markers = [
    "gpu: requires real models or GPU hardware",
    "qdrant_server: needs a Qdrant server at DOCGREP_TEST_QDRANT_URL",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/docgrep/__init__.py:__version__"]
build_command = "pip install uv && uv lock && git add uv.lock"
