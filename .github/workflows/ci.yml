name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra cpu
      - name: Wait for Qdrant
        run: |
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:6333/ > /dev/null && exit 0
            sleep 1
          done
          echo "Qdrant did not become ready" >&2
          exit 1
      - name: Check
        shell: bash
        env:
          DOCGREP_TEST_QDRANT_URL: http://localhost:6333
          PYTEST_ADDOPTS: "--junitxml=reports/junit.xml -rfE --durations=20"
        run: |
          mkdir -p reports
          scripts/check.sh 2>&1 | tee reports/check.log
      # Failing tests become check-run annotations, readable through the REST
      # API without the job log (#34).
      - name: Annotate failing tests
        if: failure()
        run: python3 scripts/ci_annotate_failures.py reports/junit.xml
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports-${{ github.event_name }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 14
