name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Wait for Qdrant
        run: |
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:6333/ > /dev/null && exit 0
            sleep 1
          done
          echo "Qdrant did not become ready" >&2
          exit 1
      - run: scripts/check.sh
        env:
          DOCGREP_TEST_QDRANT_URL: http://localhost:6333
